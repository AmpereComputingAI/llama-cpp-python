name: Build Release for Ampere

on:
  workflow_dispatch:
  push:
    branches:
      - ampere-build-3.2.1-devel
      - ampere-build-3.2.1

permissions:
  contents: write

jobs:
  build_wheels_arm64:
    name: Build arm64 wheel (Python ${{ matrix.python-version }})
    runs-on: [self-hosted]
    container:
      image: ubuntu:24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y git cmake ninja-build gcc g++ curl

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: python -m pip install build scikit-build-core

      - name: Build wheel
        run: CMAKE_ARGS="-DGGML_NATIVE=ON" python -m build --wheel --outdir wheelhouse/

      - name: Inspect wheel contents
        run: |
          for whl in wheelhouse/*.whl; do
            echo "=== $(basename $whl) ==="
            python -m zipfile -l "$whl"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}
          path: ./wheelhouse/*.whl

  release:
    name: Release
    needs: [build_wheels_arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted]
    container:
      image: ubuntu:24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-py*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
